name: Deploy Showcase (showcase.joecodes.in)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/showcase/**'
      - '.github/workflows/deploy-showcase.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Showcase
        run: npm run build:showcase

      - name: Deploy to Hostinger via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "apps/showcase/dist/*"
          target: "~/domains/showcase.joecodes.in/public_html/"
          strip_components: 3
